name: Daily POV Business Video (FR)

on:
    schedule:
    - cron: "0 0 * * *"   # 08:00 Chine
    - cron: "0 8 * * *"   # 16:00 Chine
  workflow_dispatch: {}

jobs:
  send-pack:
    runs-on: ubuntu-latest
    env:
      RUN_SLOT: ${{ github.event.schedule == '0 8 * * *' && 'afternoon' || 'morning' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate and send daily pack
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/generate_and_send.py
